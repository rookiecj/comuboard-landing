server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Root request — serves landing index.html (no cache)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }

    # /landing/* — strip /landing prefix, serve file from root
    # Traefik strips /app/comuboard → nginx receives /landing/assets/xxx.js
    # Rewrite to /assets/xxx.js and re-evaluate
    location ~ ^/landing/(.+)$ {
        try_files /$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for any other path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
