server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Root request — serves landing index.html (no cache)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }

    # /landing/* — maps to html root via alias
    # Traefik strips /app/comuboard, so /landing/assets/xxx.js → /usr/share/nginx/html/assets/xxx.js
    location /landing/ {
        alias /usr/share/nginx/html/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for any other path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets at root level (prod serves from /)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
