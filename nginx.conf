server {
    # STORY-193-01 (SPRINT-193 BUG-192-01 fix): nginxinc/nginx-unprivileged
    # image listens on 8080 (uid=101 + readOnlyRootFilesystem 하에서 privileged
    # port 80 binding 불필요). Service contract port 80 유지, targetPort 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Root request — serves landing index.html (no cache)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }

    # /landing/* — strip /landing prefix, serve file from root
    # Traefik strips /app/comuboard → nginx receives /landing/assets/xxx.js
    # Rewrite to /assets/xxx.js and re-evaluate
    # BUG-261-04 fix (SPRINT-261): SPA route (e.g. /landing/help/ai-byoai) 가
    # 실제 정적 파일에 매칭 안 되면 index.html 로 fallback — React Router 가
    # client-side routing 처리. 직전 `=404` 는 SPA route 를 404 로 반환 →
    # `/landing/help/ai-byoai` 같은 client-only 경로 차단되었음.
    location ~ ^/landing/(.+)$ {
        try_files /$1 /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for any other path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # STORY-186-01 / Security §4.2 권고 #7:
    # Source maps are emitted with `sourcemap: 'hidden'` for Sentry CLI upload
    # only and must never reach the browser. Deny any direct .map fetch even
    # though Vite no longer references them from the bundle.
    location ~ \.map$ {
        deny all;
        return 404;
    }
}
